[package]
name = "sen-ui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/eiennohito/sen"
publish = false
description = "Slint UI for an unofficial desktop client for the LINE messaging service"

# Generated code only; building it again as an empty test harness costs ~7 s per .slint edit.
[lib]
test = false
doctest = false

[features]
demo = []
testing = []
ui-debug = ["slint/mcp"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software"] }

[build-dependencies]
slint-build = "=1.18.1"
