[package]
name = "line-desktop-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generated Slint UI for the LINE desktop client"

[features]
testing = []
ui-debug = ["slint/mcp"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18"] }

[build-dependencies]
slint-build = "=1.18.1"
