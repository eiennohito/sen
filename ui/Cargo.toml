[package]
name = "line-desktop-ui"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generated Slint UI for the LINE desktop client"

# Generated code only; building it again as an empty test harness costs ~7 s per .slint edit.
[lib]
test = false
doctest = false

[features]
demo = []
testing = []
ui-debug = ["slint/mcp"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software"] }

[build-dependencies]
slint-build = "=1.18.1"
