[package]
name = "line-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Software-rendered Slint sketch for a native LINE client"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "accessibility"] }

[build-dependencies]
slint-build = "=1.18.1"
