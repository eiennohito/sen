[package]
name = "sen-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Unofficial desktop client for the LINE messaging service"

[features]
demo = ["dep:tempfile", "sen/demo", "sen-ui/demo"]
ui-debug = ["demo", "sen-ui/ui-debug", "dep:i-slint-backend-selector"]

[dev-dependencies]
sen-ui = { path = "../ui", features = ["testing"] }
i-slint-backend-testing = "=1.18.1"
sen = { path = "..", features = ["demo"] }

[dependencies]
icu_normalizer = { version = "=2.3.0", default-features = false, features = ["compiled_data"] }
libc = "0.2"
tempfile = { version = "3", optional = true }
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "unstable-winit-030", "unstable-fontique-011", "renderer-software", "accessibility"] }
sen = { path = ".." }
sen-ui = { path = "../ui" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2"
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
unicode-segmentation = "1.13"
unicode-linebreak = "0.1.5"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

i-slint-core = { version = "=1.18.1", default-features = false }

i-slint-backend-selector = { version = "=1.18.1", default-features = false, features = ["mcp"], optional = true }

[[bin]]
name = "sen"
path = "src/main.rs"
