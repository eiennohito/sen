[package]
name = "line-desktop"
version = "0.1.0"
edition = "2024"
publish = false
description = "Software-rendered Slint LINE client using the original crypto WASM"

[features]
ui-debug = ["line-desktop-ui/ui-debug", "dep:i-slint-backend-selector"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-18", "backend-winit", "unstable-winit-030", "renderer-software", "accessibility"] }
line-client = { path = ".." }
line-desktop-ui = { path = "../ui" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
url = "2"
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
unicode-segmentation = "1.13"
unicode-linebreak = "0.1.5"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

i-slint-backend-selector = { version = "=1.18.1", default-features = false, features = ["mcp"], optional = true }
