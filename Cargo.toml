[package]
name = "sen"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/eiennohito/sen"
description = "Core for an unofficial desktop client for the LINE messaging service"

[workspace]
members = ["app", "ui"]
default-members = ["."]
resolver = "3"
exclude = ["third_party/i-slint-renderer-software-1.18.1", "third_party/parley-0.11.1"]

[features]
default = []
harness = []
demo = []

[[example]]
name = "crypto-harness"
required-features = ["harness"]

[dependencies]
ttf-parser = "0.25.1"
fontique = "=0.11.1"
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasmi = { version = "0.46", default-features = false, features = ["std"] }
aes = "0.8"
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
ctr = "0.9"
hkdf = "0.12"
hmac = "0.12"
qrcodegen = "1.8.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
libc = "0.2"
hyper = { version = "1.12", default-features = false, features = ["client", "http1"] }
http-body-util = "0.1"
bytes = "1"
async-executor = "1.14"
async-io = "2.6"
async-net = "2"
async-channel = "2"
futures-lite = "2.6"
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
url = "2"
percent-encoding = "2"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
sys-locale = "0.3"
tempfile = "3"

[dev-dependencies]
zbus = { version = "5.19", default-features = false, features = ["p2p"] }
sen = { path = ".", features = ["demo"] }
socket2 = "0.6"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }

[profile.fast]
inherits = "release"
incremental = true

[profile.fast.package.sen-desktop]
opt-level = 0

[profile.fast.package.sen-ui]
opt-level = 0

# The Slint compiler runs in ui/build.rs on every .slint edit.
[profile.fast.build-override]
opt-level = 2

# File and line in backtraces; full debug info made the dev binary 760 MB.
[profile.dev]
debug = "line-tables-only"

# The crypto module runs in wasmi; unoptimized it is ~10x slower in tests.
[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
i-slint-renderer-software = { path = "third_party/i-slint-renderer-software-1.18.1" }
parley = { path = "third_party/parley-0.11.1" }
