[package]
name = "line-wasm-poc"
version = "0.1.0"
edition = "2024"
description = "Rust host and client adapter for the unmodified LINE Chrome crypto WASM"

[workspace]
members = ["app", "ui"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasmi = { version = "0.46", default-features = false, features = ["std"] }
aes = "0.8"
aes-gcm = { version = "=0.10.3", default-features = false, features = ["aes", "alloc"] }
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
ctr = "0.9"
hkdf = "0.12"
hmac = "0.12"
qrcodegen = "1.8.0"
subtle = "2.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
socket2 = "0.6"
libc = "0.2"
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "rustls-webpki-roots"] }
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"

[dev-dependencies]
curve25519-dalek = "=4.1.3"
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }

[profile.fast]
inherits = "release"
incremental = true

[profile.fast.package.line-desktop]
opt-level = 0

[profile.fast.package.line-desktop-ui]
opt-level = 0
