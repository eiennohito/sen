[package]
name = "line-wasm-poc"
version = "0.1.0"
edition = "2024"
description = "Rust host and client adapter for the unmodified LINE Chrome crypto WASM"

[workspace]
members = ["app"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasmi = { version = "0.46", default-features = false, features = ["std"] }
aes = "0.8"
ctr = "0.9"
hkdf = "0.12"
hmac = "0.12"
qrcodegen = "1.8.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls", "rustls-webpki-roots"] }

[dev-dependencies]
rcgen = { version = "=0.14.10", default-features = false, features = ["ring"] }
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std"] }
socket2 = "0.6"
